<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Greeting App - Greeting</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 0 1rem; color: #202124; }
        button { margin-top: 1.5rem; padding: .7rem 1rem; border: 0; border-radius: 6px; background: #1457c5; color: white; font: inherit; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <h1 th:text="|Hello ${firstName} ${lastName}!|">Hello First Last!</h1>
    <form th:action="@{/home}" method="post">
        <button type="submit">Return to Home Page</button>
    </form>
</main>
</body>
</html>
