<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Greeting App - Home</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 0 1rem; color: #202124; }
        h1 { margin-bottom: 1.5rem; }
        .field { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; margin-bottom: .35rem; }
        input { box-sizing: border-box; width: 100%; padding: .7rem; border: 1px solid #9aa0a6; border-radius: 6px; font: inherit; }
        button { margin-top: .5rem; padding: .7rem 1rem; border: 0; border-radius: 6px; background: #1457c5; color: white; font: inherit; cursor: pointer; }
        .error { color: #b42318; font-size: .9rem; margin-top: .25rem; }
    </style>
</head>
<body>
<main>
    <h1>Welcome</h1>
    <form th:action="@{/greet}" th:object="${greetingForm}" method="post">
        <div class="field">
            <label for="firstName">First name</label>
            <input id="firstName" type="text" th:field="*{firstName}" autocomplete="given-name"
                   maxlength="80" required>
            <p class="error" th:if="${#fields.hasErrors('firstName')}"
               th:errors="*{firstName}">First name error</p>
        </div>
        <div class="field">
            <label for="lastName">Last name</label>
            <input id="lastName" type="text" th:field="*{lastName}" autocomplete="family-name"
                   maxlength="80" required>
            <p class="error" th:if="${#fields.hasErrors('lastName')}"
               th:errors="*{lastName}">Last name error</p>
        </div>
        <button type="submit">Submit</button>
    </form>
</main>
</body>
</html>
